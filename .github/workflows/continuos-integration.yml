name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup update --no-self-update stable
        rustup component add rustfmt

    - name: Run fmt
      run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup update --no-self-update stable
        rustup component add clippy

    - name: Run clippy
      run: cargo clippy --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20

    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run Versity S3 Gateway
      if: matrix.platform == 'ubuntu-24.04'
      run: |
        docker run -d -p 9000:7070 \
          versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316 \
          --access minioadmin --secret minioadmin --region minio --port :7070 \
          posix /tmp/vgw
        timeout 30 sh -c 'until curl -s -o /dev/null http://localhost:9000; do sleep 0.1; done'

    - name: Run tests (aws-lc-rs)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --locked --no-default-features --features aws-lc-rs

    - name: Run tests (rustcrypto)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --locked --no-default-features --features rustcrypto

    - name: Run tests (graviola)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --locked --no-default-features --features graviola

    - name: Run tests (default features)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --locked

    - name: Run tests (xml, not full)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --locked --no-default-features --features rustcrypto,xml

    - name: Run tests (aws-lc-rs)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --locked --lib --no-default-features --features aws-lc-rs

    - name: Run tests (rustcrypto)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --locked --lib --no-default-features --features rustcrypto

    - name: Run tests (graviola)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --locked --lib --no-default-features --features graviola

    - name: Run tests (default features)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --locked --lib

    - name: Run tests (xml, not full)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --locked --lib --no-default-features --features rustcrypto,xml

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      run: rustup default 1.89

    - name: Run tests
      run: cargo test --locked --lib

    - name: Run tests (aws-lc-rs)
      run: cargo test --locked --lib --no-default-features --features aws-lc-rs

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install cargo-tarpaulin
      run: |
        LINK="https://github.com/xd009642/tarpaulin/releases/download/0.31.3/cargo-tarpaulin-x86_64-unknown-linux-gnu.tar.gz"
        curl -L --output tarpaulin.tar.gz "$LINK"
        tar -xzvf tarpaulin.tar.gz
        chmod +x cargo-tarpaulin

    - name: Run cargo-tarpaulin
      run: ./cargo-tarpaulin tarpaulin --lib --out Xml

    - name: Upload to codecov.io
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Archive code coverage results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: code-coverage-report
        path: cobertura.xml
