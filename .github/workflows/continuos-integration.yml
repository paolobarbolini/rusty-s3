name: CI

on: [push, pull_request]

jobs:
  fmt:
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      run: |
        rustup update --no-self-update stable
        rustup component add rustfmt

    - name: Run fmt
      run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      run: |
        rustup update --no-self-update stable
        rustup component add clippy

    - name: Run clippy
      run: cargo clippy

  test:
    strategy:
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run Versity S3 Gateway
      if: matrix.platform == 'ubuntu-24.04'
      run: |
        docker run -d -p 9000:7070 \
          versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316 \
          --access minioadmin --secret minioadmin --region minio --port :7070 \
          posix /tmp/vgw
        timeout 30 sh -c 'until curl -s -o /dev/null http://localhost:9000; do sleep 0.1; done'

    - name: Run tests (aws-lc-rs)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --no-default-features --features aws-lc-rs

    - name: Run tests (rustcrypto)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --no-default-features --features rustcrypto

    - name: Run tests (graviola)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --no-default-features --features graviola

    - name: Run tests (default features)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test

    - name: Run tests (xml, not full)
      if: matrix.platform == 'ubuntu-24.04'
      run: cargo test --no-default-features --features rustcrypto,xml

    - name: Run tests (aws-lc-rs)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --lib --no-default-features --features aws-lc-rs

    - name: Run tests (rustcrypto)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --lib --no-default-features --features rustcrypto

    - name: Run tests (graviola)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --lib --no-default-features --features graviola

    - name: Run tests (default features)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --lib

    - name: Run tests (xml, not full)
      if: matrix.platform != 'ubuntu-24.04'
      run: cargo test --lib --no-default-features --features rustcrypto,xml

  msrv:
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      run: rustup default 1.89

    - name: Run tests
      run: cargo test --lib

  coverage:
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install cargo-tarpaulin
      run: |
        LINK="https://github.com/xd009642/tarpaulin/releases/download/0.31.3/cargo-tarpaulin-x86_64-unknown-linux-gnu.tar.gz"
        curl -L --output tarpaulin.tar.gz "$LINK"
        tar -xzvf tarpaulin.tar.gz
        chmod +x cargo-tarpaulin

    - name: Run cargo-tarpaulin
      run: ./cargo-tarpaulin tarpaulin --lib --out Xml

    - name: Upload to codecov.io
      uses: codecov/codecov-action@v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        args: '--lib'

    - name: Archive code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report
        path: cobertura.xml
